name: wipstudio-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: wipstudio-db-dev
    restart: unless-stopped
    env_file:
      - .env.development
    volumes:
      - db-dev:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    container_name: wipstudio-rustfs-dev
    volumes:
      - uploads-dev:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.development
    environment:
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-"access-key"}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-"secret-key"}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully

  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - uploads-dev:/fix_path
    command: chown -R 10001:10001 /fix_path && echo "Permissions set for RustFS"

volumes:
  db-dev:
  uploads-dev:
