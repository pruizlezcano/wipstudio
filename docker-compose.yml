name: wipstudio
services:
  caddy:
    image: ghcr.io/pruizlezcano/wipstudio-caddy:latest
    container_name: wipstudio-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - wipstudio
      - rustfs

  wipstudio:
    image: ghcr.io/pruizlezcano/wipstudio:latest
    container_name: wipstudio-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  websocket:
    image: ghcr.io/pruizlezcano/wipstudio:latest
    container_name: wipstudio-websocket
    restart: unless-stopped
    command: ["bun", "run", "websocket"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: wipstudio-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    container_name: wipstudio-rustfs
    volumes:
      - uploads:/data
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db:
  uploads:
